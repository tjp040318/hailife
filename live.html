<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live ride — HaiLife</title>
<!-- The app's live-ride share links open this page: tjp040318.github.io/hailife/live.html?code=ABC123
     Data comes from the live-beacon-view edge function (format=json), which checks the
     share code; the page holds no key. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4efe6; }
  #map { z-index: 1; }
  #stats {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
    background: rgba(21, 94, 72, 0.96); color: #fff; border-radius: 14px;
    padding: 12px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); font-size: 14px;
  }
  #stats h1 { font-size: 16px; margin: 0 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .metric { display: flex; flex-direction: column; }
  .value { font-size: 18px; font-weight: 700; }
  .label { font-size: 10px; opacity: 0.85; text-transform: uppercase; }
  #fresh { font-size: 11px; opacity: 0.8; margin-top: 4px; }
  #message { display: none; padding: 48px 24px; text-align: center; color: #1d2b25; }
  #message h1 { color: #155e48; font-size: 22px; }
</style>
</head>
<body>
<div id="message"><h1 id="message-title"></h1><p id="message-body"></p></div>
<div id="map"></div>
<div id="stats">
  <h1 id="title">Live ride</h1>
  <div class="row">
    <div class="metric"><span class="value" id="m-speed">--</span><span class="label">km/h</span></div>
    <div class="metric"><span class="value" id="m-distance">--</span><span class="label">km</span></div>
    <div class="metric"><span class="value" id="m-hr">--</span><span class="label">bpm</span></div>
    <div class="metric"><span class="value" id="m-power">--</span><span class="label">W</span></div>
    <div class="metric"><span class="value" id="m-elapsed">--</span><span class="label">elapsed</span></div>
  </div>
  <div id="fresh">Connecting…</div>
</div>
<script>
  const ENDPOINT = "https://hnwjkhyzcefuhobeimun.supabase.co/functions/v1/live-beacon-view";
  const code = (new URLSearchParams(location.search).get("code") || "").trim().toUpperCase();

  let map = null, marker = null, trail = null, timer = null;

  function showMessage(title, body) {
    clearInterval(timer);
    document.getElementById("map").style.display = "none";
    document.getElementById("stats").style.display = "none";
    document.getElementById("message").style.display = "block";
    document.getElementById("message-title").textContent = title;
    document.getElementById("message-body").textContent = body;
  }

  function formatElapsed(s) {
    if (s == null) return "--";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h > 0 ? h + "h " + m + "m" : m + "m";
  }

  function setText(id, text) { document.getElementById(id).textContent = text; }

  async function refresh() {
    let res;
    try {
      res = await fetch(ENDPOINT + "?format=json&code=" + encodeURIComponent(code), { cache: "no-store" });
    } catch (e) {
      setText("fresh", "Can't reach the server — retrying…");
      return;
    }
    if (res.status === 404) {
      showMessage("This ride has ended.", "The live share for code " + code + " isn't running any more.");
      return;
    }
    if (!res.ok) { setText("fresh", "Can't load the ride — retrying…"); return; }
    const data = await res.json();
    setText("title", data.title || "Live ride");
    document.title = (data.title || "Live ride") + " — HaiLife";
    const points = (data.positions || []).filter(p => p.latitude != null && p.longitude != null);
    if (!points.length) { setText("fresh", "Waiting for the first position…"); return; }

    const latest = points[points.length - 1];
    const ll = [latest.latitude, latest.longitude];
    if (!map) {
      map = L.map("map").setView(ll, 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap"
      }).addTo(map);
      marker = L.marker(ll).addTo(map);
      trail = L.polyline([], { color: "#155e48", weight: 4 }).addTo(map);
    }
    marker.setLatLng(ll);
    trail.setLatLngs(points.map(p => [p.latitude, p.longitude]));
    map.panTo(ll, { animate: true });

    setText("m-speed", latest.speed_kph != null ? latest.speed_kph.toFixed(0) : "--");
    setText("m-distance", latest.distance_m != null ? (latest.distance_m / 1000).toFixed(1) : "--");
    setText("m-hr", latest.heart_rate_bpm || "--");
    setText("m-power", latest.power_w || "--");
    setText("m-elapsed", formatElapsed(latest.elapsed_sec));
    setText("fresh", "Updated " + new Date(latest.reported_at).toLocaleTimeString());
  }

  if (!code) {
    showMessage("No ride code.", "Open the link the rider shared with you from HaiLife.");
  } else {
    refresh();
    timer = setInterval(refresh, 5000);
  }
</script>
</body>
</html>
